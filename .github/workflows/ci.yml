# Notepad CI — runs on every push and pull request; a tag v* also publishes a release.
#
#   check    sh check.sh: gofmt, go vet, go test, govulncheck, staticcheck, translations,
#            editor bundle, the
#            lintux-modkit pin, browser test (Playwright) and the single-file bind mount (Docker)
#   build    build.sh for amd64 and arm64, then the same image again under umask 002 and 077
#            (tools/check-reproducible.sh); the images as artifacts (arm64 is built, not
#            tested on hardware here)
#   release  on a tag: the images and their .sha256 files as release assets
#
# Actions are pinned to commit SHAs (the tag in the comment): a moved tag cannot change
# what builds and publishes the root-run images.
#
# go.mod replaces lintux-modkit with ../lintux-modkit, so every job checks out both
# repositories side by side, lintux-modkit at the commit in lintux-modkit.ref (build.sh
# refuses another one), as zima-modmanager does.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: zima-notepad

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: zima-notepad }
      - run: echo "MODKIT_REF=$(cut -d' ' -f2 lintux-modkit.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: chicohaager/lintux-modkit, ref: "${{ env.MODKIT_REF }}", path: lintux-modkit }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: zima-notepad/go.mod, cache: false }
      - name: Playwright with Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install --quiet playwright==1.65.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_PYTHON=$RUNNER_TEMP/pw/bin/python" >> "$GITHUB_ENV"
      - run: sh check.sh

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: zima-notepad }
      - run: echo "MODKIT_REF=$(cut -d' ' -f2 lintux-modkit.ref)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: chicohaager/lintux-modkit, ref: "${{ env.MODKIT_REF }}", path: lintux-modkit }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: zima-notepad/go.mod, cache: false }
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: bash tools/check-reproducible.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notepad-${{ matrix.arch }}
          path: zima-notepad/dist/notepad-${{ matrix.arch }}.raw*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: ls -la && sha256sum -c notepad-amd64.raw.sha256 notepad-arm64.raw.sha256
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
